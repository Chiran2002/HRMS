<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional HRMS (Dark Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-building-user"></i>
            <h2>HRMS Pro</h2>
        </div>
        <ul class="nav-links">
            <li><button class="active" onclick="loadData('employees', this)"><i class="fa-solid fa-users"></i> Employees</button></li>
            <li><button onclick="loadData('time_attendance', this)"><i class="fa-solid fa-user-clock"></i> Time & Attendance</button></li>
            <li><button onclick="loadData('payroll', this)"><i class="fa-solid fa-file-invoice-dollar"></i> Payroll</button></li>
        </ul>
    </div>
    
    <div class="main-content">
        <header class="topbar">
            <h1 id="page-title">Employees Data</h1>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=0b1120&color=0ea5e9" alt="Admin">
                <span>Admin User</span>
            </div>
        </header>

        <div class="dashboard-cards">
            <div class="card" onclick="filterByCard(1)" style="cursor: pointer;">
                <div class="card-info">
                    <h3 id="card-1-title">Total Employees</h3>
                    <p id="card-1-value">0</p>
                </div>
                <div class="card-icon" id="card-1-icon" style="color: #38bdf8; background: rgba(56, 189, 248, 0.1);"><i class="fa-solid fa-users" id="icon-1"></i></div>
            </div>
            <div class="card" onclick="filterByCard(2)" style="cursor: pointer;">
                <div class="card-info">
                    <h3 id="card-2-title">Departments</h3>
                    <p id="card-2-value">0</p>
                </div>
                <div class="card-icon" id="card-2-icon" style="color: #a78bfa; background: rgba(167, 139, 250, 0.1);"><i class="fa-solid fa-building" id="icon-2"></i></div>
            </div>
            <div class="card" onclick="filterByCard(3)" style="cursor: pointer;">
                <div class="card-info">
                    <h3 id="card-3-title">Total Monthly Salary</h3>
                    <p id="card-3-value">Rs. 0</p>
                </div>
                <div class="card-icon" id="card-3-icon" style="color: #34d399; background: rgba(52, 211, 153, 0.1);"><i class="fa-solid fa-money-bill-wave" id="icon-3"></i></div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by name, email, department...">
            </div>
            
            <div id="date-filter-container" class="hidden" style="display: none; align-items: center; gap: 10px; margin-left: 20px;">
                <label style="color: var(--text-muted); font-size: 14px; font-weight: 500;"><i class="fa-solid fa-calendar-day"></i> Filter Date:</label>
                <input type="date" id="filter-date" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--surface-bg); color: var(--text-main); outline: none; font-family: 'Inter', sans-serif;">
            </div>

            <div style="display: flex; gap: 10px; margin-left: auto;">
                <button class="btn-secondary" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                <button class="btn-secondary" onclick="exportToPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                <button id="main-action-btn" class="btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Employee</button>
            </div>
        </div>

        <div class="table-container">
            <div id="loader" class="loader hidden"></div>
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="employee-modal" class="modal hidden">
        <div class="modal-content" style="width: 700px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h2 id="modal-title">Add New Employee</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="add-employee-form">
                <h3 style="color: var(--primary-color); font-size: 14px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Personal Details</h3>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>First Name</label><input type="text" id="first_name" required></div>
                    <div class="form-group" style="flex:1"><label>Last Name</label><input type="text" id="last_name" required></div>
                    <div class="form-group" style="flex:1"><label>NIC Number</label><input type="text" id="nic" required></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Date of Birth</label><input type="date" id="dob" required></div>
                    <div class="form-group" style="flex:1"><label>Gender</label>
                        <select id="gender" required style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);">
                            <option value="Male">Male</option><option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1"><label>Marital Status</label>
                        <select id="marital_status" style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);">
                            <option value="Single">Single</option><option value="Married">Married</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1"><label>Blood Group</label>
                        <select id="blood_group" style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);">
                            <option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option><option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <h3 style="color: var(--primary-color); font-size: 14px; margin: 15px 0 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Contact Details</h3>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Email</label><input type="email" id="email" required></div>
                    <div class="form-group" style="flex:1"><label>Phone</label><input type="text" id="phone" required></div>
                    <div class="form-group" style="flex:1"><label>Emergency Contact</label><input type="text" id="emergency_contact" required></div>
                </div>
                <div class="form-group"><label>Permanent Address</label><input type="text" id="address" required></div>

                <h3 style="color: var(--primary-color); font-size: 14px; margin: 15px 0 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Employment Details</h3>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>EPF Number</label><input type="text" id="epf_number"></div>
                    <div class="form-group" style="flex:1"><label>Employment Type</label>
                        <select id="employment_type" style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);">
                            <option value="Permanent">Permanent</option><option value="Probation">Probation</option><option value="Contract">Contract</option><option value="Intern">Intern</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1"><label>Status</label>
                        <select id="employee_status" style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color);">
                            <option value="Active">Active</option><option value="Resigned">Resigned</option><option value="Terminated">Terminated</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Department</label><input type="text" id="department" required></div>
                    <div class="form-group" style="flex:1"><label>Designation</label><input type="text" id="designation" required></div>
                    <div class="form-group" style="flex:1"><label>Reporting Manager</label><input type="text" id="reporting_manager"></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Branch / Location</label><input type="text" id="branch" value="Head Office"></div>
                    <div class="form-group" style="flex:1"><label>Hire Date</label><input type="date" id="hire_date" required></div>
                    <div class="form-group" style="flex:1"><label>Basic Salary (Rs.)</label><input type="number" id="basic_salary" step="0.01" required></div>
                </div>

                <h3 style="color: var(--primary-color); font-size: 14px; margin: 15px 0 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Bank Details</h3>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Bank Name</label><input type="text" id="bank_name" required></div>
                    <div class="form-group" style="flex:1"><label>Account Number</label><input type="text" id="bank_account" required></div>
                </div>

                <h3 style="color: var(--primary-color); font-size: 14px; margin: 15px 0 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Documents & Uploads</h3>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1">
                        <label>Profile Picture (Image)</label>
                        <input type="file" id="profile_picture" accept="image/*" style="padding: 7px;">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Employee CV (PDF/Word)</label>
                        <input type="file" id="cv_file" accept=".pdf,.doc,.docx" style="padding: 7px;">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center; font-size: 15px; padding: 12px;">Save Employee Record</button>
            </form>
        </div>
    </div>

    <div id="leave-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h2>Apply Leave</h2><span class="close-btn" onclick="closeLeaveModal()">&times;</span></div>
            <form id="apply-leave-form">
                <div class="form-group"><label>Employee ID</label><input type="number" id="lv_emp_id" required></div>
                <div class="form-group"><label>Leave Type</label>
                    <select id="lv_type" required style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main);">
                        <option value="Annual">Annual Leave</option>
                        <option value="Medical">Medical Leave</option>
                        <option value="Casual">Casual Leave</option>
                    </select>
                </div>
                <div class="form-group"><label>Start Date</label><input type="date" id="lv_start_date" required></div>
                <div class="form-group"><label>End Date</label><input type="date" id="lv_end_date" required></div>
                <div class="form-group"><label>Status</label>
                    <select id="lv_status" required style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main);">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save Leave</button>
            </form>
        </div>
    </div>

    <div id="attendance-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h2>Mark Attendance</h2><span class="close-btn" onclick="closeAttendanceModal()">&times;</span></div>
            <form id="add-attendance-form">
                <div class="form-group"><label>Employee ID</label><input type="number" id="att_emp_id" required></div>
                <div class="form-group"><label>Date</label><input type="date" id="att_date" required></div>
                <div class="form-group"><label>Status</label>
                    <select id="att_status" required style="width: 100%; padding: 10px; border-radius: 6px; background-color: var(--bg-color); color: var(--text-main);">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="On Leave">On Leave</option>
                        <option value="Out of Office">Out of Office</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Step Out Time</label><input type="time" id="att_step_out"></div>
                    <div class="form-group" style="flex:1"><label>Return Time</label><input type="time" id="att_return"></div>
                </div>
                <div class="form-group"><label>OT Hours (If any)</label><input type="number" id="att_ot_hours" step="0.5" value="0"></div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save</button>
            </form>
        </div>
    </div>

    <div id="advance-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h2>Add Salary Advance</h2><span class="close-btn" onclick="closeAdvanceModal()">&times;</span></div>
            <form id="add-advance-form">
                <div class="form-group"><label>Employee ID</label><input type="number" id="adv_emp_id" required></div>
                <div class="form-group"><label>Date</label><input type="date" id="adv_date" required></div>
                <div class="form-group"><label>Amount (Rs.)</label><input type="number" id="adv_amount" step="0.01" required></div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save Advance</button>
            </form>
        </div>
    </div>

    <div id="payroll-modal" class="modal hidden">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header"><h2>Generate Auto Payroll</h2><span class="close-btn" onclick="closePayrollModal()">&times;</span></div>
            <form id="add-payroll-form">
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Employee ID</label><input type="number" id="pay_emp_id" required></div>
                    <div class="form-group" style="flex:1"><label>Month (YYYY-MM)</label><input type="month" id="pay_month_year" required onchange="fetchAutoSalaryData()"></div>
                </div>
                <button type="button" class="btn-secondary" onclick="fetchAutoSalaryData()" style="width: 100%; margin-bottom: 15px; justify-content: center; background-color: #0ea5e9;">
                    <i class="fa-solid fa-calculator"></i> Auto-Fetch Data
                </button>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Basic Salary (Rs.)</label><input type="number" id="pay_basic" readonly></div>
                    <div class="form-group" style="flex:1"><label>Attended Days</label><input type="number" id="pay_attended" readonly></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Total OT Hours</label><input type="number" id="pay_ot_hours" readonly></div>
                    <div class="form-group" style="flex:1"><label>OT Hourly Rate (Rs.)</label><input type="number" id="pay_ot_rate" value="500" oninput="calculateFinalSalary()"></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1"><label>Advances Taken (Rs.)</label><input type="number" id="pay_advances" readonly></div>
                    <div class="form-group" style="flex:1"><label>Other Deductions (Rs.)</label><input type="number" id="pay_deductions" value="0" oninput="calculateFinalSalary()"></div>
                </div>
                <div class="form-group">
                    <label style="color: #34d399; font-size: 16px;">Net Salary (Rs.)</label>
                    <input type="number" id="pay_net" readonly style="border-color: #34d399; font-weight: bold; font-size: 18px; color: #34d399; background-color: var(--bg-color);">
                </div>
                <div class="form-group"><label>Payment Date</label><input type="date" id="pay_date" required></div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; background-color: #10b981;">Generate Payroll</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="script.js"></script>
</body>
</html>
