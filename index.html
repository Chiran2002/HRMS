<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional HRMS (Dark Mode)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-building-user"></i>
            <h2>HRMS Pro</h2>
        </div>
        <ul class="nav-links">
            <li><button class="active" onclick="loadData('employees', this)"><i class="fa-solid fa-users"></i> Employees</button></li>
            <li><button onclick="loadData('attendance', this)"><i class="fa-solid fa-clock-rotate-left"></i> Attendance</button></li>
            <li><button onclick="loadData('leaves', this)"><i class="fa-solid fa-calendar-minus"></i> Leaves</button></li>
            <li><button onclick="loadData('payroll', this)"><i class="fa-solid fa-file-invoice-dollar"></i> Payroll</button></li>
        </ul>
    </div>
    
    <div class="main-content">
        <header class="topbar">
            <h1 id="page-title">Employees Data</h1>
            <div class="user-profile">
                <!-- User Profile Image styling changed for Dark Blue theme -->
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=0b1120&color=0ea5e9" alt="Admin">
                <span>Admin User</span>
            </div>
        </header>

        <!-- Advanced Dashboard Summary Cards (Dark Theme colors) -->
        <div class="dashboard-cards">
            <div class="card">
                <div class="card-info">
                    <h3>Total Employees</h3>
                    <p id="total-count">0</p>
                </div>
                <!-- Glowing Blue Icon -->
                <div class="card-icon" style="color: #38bdf8; background: rgba(56, 189, 248, 0.1);"><i class="fa-solid fa-users"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3>Departments</h3>
                    <p id="total-departments">0</p>
                </div>
                <!-- Glowing Purple Icon -->
                <div class="card-icon" style="color: #a78bfa; background: rgba(167, 139, 250, 0.1);"><i class="fa-solid fa-building"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3>Total Monthly Salary</h3>
                    <p id="total-salary">Rs. 0</p>
                </div>
                <!-- Glowing Green Icon -->
                <div class="card-icon" style="color: #34d399; background: rgba(52, 211, 153, 0.1);"><i class="fa-solid fa-money-bill-wave"></i></div>
            </div>
        </div>

        <!-- Controls: Search Bar & Buttons -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search by name, email, department...">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                <button class="btn-secondary" onclick="exportToPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                <button id="main-action-btn" class="btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Employee</button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="table-container">
            <div id="loader" class="loader hidden"></div>
            <table id="data-table">
                <thead id="table-head">
                    <!-- Table headers dynamically generated -->
                </thead>
                <tbody id="table-body">
                    <!-- Table rows dynamically generated -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Employee Modal -->
    <div id="employee-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Employee</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="add-employee-form">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department">
                </div>
                <div class="form-group">
                    <label>Hire Date</label>
                    <input type="date" id="hire_date">
                </div>
                <div class="form-group">
                    <label>Basic Salary</label>
                    <input type="number" id="basic_salary" step="0.01">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save Employee</button>
            </form>
        </div>
    </div>

    <!-- Mark Attendance Modal -->
    <div id="attendance-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Mark Attendance</h2>
                <span class="close-btn" onclick="closeAttendanceModal()">&times;</span>
            </div>
            <form id="add-attendance-form">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="number" id="att_emp_id" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="att_date" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="att_status" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); outline: none;">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Half Day">Half Day</option>
                        <option value="On Leave">On Leave</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save Attendance</button>
            </form>
        </div>
    </div>
<!-- Apply Leave Modal -->
    <div id="leave-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Apply Leave</h2>
                <span class="close-btn" onclick="closeLeaveModal()">&times;</span>
            </div>
            <form id="apply-leave-form">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="number" id="lv_emp_id" required>
                </div>
                <div class="form-group">
                    <label>Leave Type</label>
                    <select id="lv_type" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); outline: none;">
                        <option value="Annual">Annual Leave</option>
                        <option value="Medical">Medical Leave</option>
                        <option value="Casual">Casual Leave</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="lv_start_date" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="lv_end_date" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="lv_status" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); outline: none;">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save Leave</button>
            </form>
        </div>
    </div>

    <!-- Apply Leave Modal -->
    <div id="leave-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Apply Leave</h2>
                <span class="close-btn" onclick="closeLeaveModal()">&times;</span>
            </div>
            <form id="apply-leave-form">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="number" id="lv_emp_id" required>
                </div>
                <div class="form-group">
                    <label>Leave Type</label>
                    <select id="lv_type" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); outline: none;">
                        <option value="Annual">Annual Leave</option>
                        <option value="Medical">Medical Leave</option>
                        <option value="Casual">Casual Leave</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="lv_start_date" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="lv_end_date" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="lv_status" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); outline: none;">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Save Leave</button>
            </form>
        </div>
    </div>

    <!-- Generate Payroll Modal -->
    <div id="payroll-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generate Payroll</h2>
                <span class="close-btn" onclick="closePayrollModal()">&times;</span>
            </div>
            <form id="add-payroll-form">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="number" id="pay_emp_id" required>
                </div>
                <div class="form-group">
                    <label>Month & Year (YYYY-MM)</label>
                    <input type="month" id="pay_month_year" required>
                </div>
                <div class="form-group">
                    <label>Basic Salary (Rs.)</label>
                    <input type="number" id="pay_basic" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Deductions (Rs.)</label>
                    <input type="number" id="pay_deductions" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label>Payment Date</label>
                    <input type="date" id="pay_date" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;">Generate Payroll</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
